name: Deploy to GitHub Pages

on:
  # push:
  #     branches:
  #         - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.22.0
          runtime: node@22
          cache: true

      - name: Build React app
        run: pnpm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ vars.VITE_APPINSIGHTS_CONNECTION_STRING }}
          # Temporary: terminal endpoints only; remove once they share the main Function App.
          VITE_TERMINAL_API_URL: ${{ vars.VITE_TERMINAL_API_URL }}

      - name: Build VitePress docs
        run: pnpm run docs:build

      - name: Merge docs into dist
        run: cp -r web/docs/.vitepress/dist web/dist/docs

      - name: Write CNAME
        if: vars.CNAME != ''
        run: echo "${{ vars.CNAME }}" > web/dist/CNAME

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
